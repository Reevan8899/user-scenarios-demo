[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "user-scenarios-demo"
version = "1.0.0"
description = "Пользовательские сценарии менеджера заметок"
requires-python = ">=3.10"
dependencies = ["filelock>=3.20,<4"]

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
